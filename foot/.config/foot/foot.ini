# Ported from the Ghostty config: same font, padding, cursor and palette.

font=JetBrainsMono Nerd Font:style=Medium:size=11
pad=10x0
selection-target=clipboard

[scrollback]
lines=100000
multiplier=2.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.96
background=000000
foreground=c0c0c0
cursor=000000 c0c0c0

selection-foreground=0a0a0a
selection-background=c0c0c0

regular0=1a1a1a
regular1=a85858
regular2=6a8a5a
regular3=c4a65a
regular4=6a7a8a
regular5=8a6a8a
regular6=6a8a8a
regular7=a0a0a0

bright0=3a3a3a
bright1=c06060
bright2=8aaa7a
bright3=d4b87c
bright4=7a8a9a
bright5=9a7a9a
bright6=7a9a9a
bright7=c0c0c0
