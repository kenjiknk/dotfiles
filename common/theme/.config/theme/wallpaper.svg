<?xml version="1.0" encoding="UTF-8"?>
<!-- Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
     (solarized-osaka). Edit templates/wallpaper.svg, not this file.

     The Tux from arindas/dotfiles-manjaro-i3 (Pictures/wallpaper.png, by
     Arindam Das), alone: its alpha mask (119x139, cut at 58,78 from the
     1920x1080 original, anti-aliasing kept) is embedded below and painted in
     the theme's accent on the panel background. Drawn by ~/Scripts/wallpaper
     at the screen's size: "slice" keeps the Tux at the top-left whatever the
     aspect ratio, and pscircle grows its process tree from that corner. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMinYMin slice">
  <defs>
    <filter id="tint" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feFlood flood-color="#268bd3"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <rect x="-4000" y="-4000" width="12000" height="12000" fill="#000f13"/>
  <image x="58" y="78" width="119" height="139" filter="url(#tint)"
         href="data:image/png;base64,"/>
</svg>
