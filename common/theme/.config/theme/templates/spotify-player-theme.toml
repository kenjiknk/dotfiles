# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# ({{meta.name}}). Edit templates/spotify-player-theme.toml, not this file.
# Selected in ~/.config/spotify-player/app.toml as theme = "desktop".

[[themes]]
name = "desktop"

[themes.palette]
background = "{{bg}}"
foreground = "{{fg}}"
black = "{{bg_dark}}"
red = "{{red}}"
green = "{{green}}"
yellow = "{{yellow}}"
blue = "{{blue}}"
magenta = "{{magenta}}"
cyan = "{{cyan}}"
white = "{{fg_warm}}"
bright_black = "{{fg_dim}}"
bright_red = "{{red2}}"
bright_green = "{{green2}}"
bright_yellow = "{{yellow2}}"
bright_blue = "{{blue2}}"
bright_magenta = "{{magenta2}}"
bright_cyan = "{{cyan2}}"
bright_white = "{{fg}}"

# The accent marks what is playing and what is selected, as everywhere else.
[themes.component_style]
block_title = { fg = "{{accent}}", modifiers = ["Bold"] }
border = { fg = "{{surface2}}" }
playback_track = { fg = "{{fg}}", modifiers = ["Bold"] }
playback_artists = { fg = "{{accent}}" }
playback_album = { fg = "{{fg_dim}}" }
playback_metadata = { fg = "{{muted}}" }
playback_progress_bar = { bg = "{{surface}}", fg = "{{accent}}" }
current_playing = { fg = "{{accent}}", modifiers = ["Bold"] }
page_desc = { fg = "{{accent}}", modifiers = ["Bold"] }
table_header = { fg = "{{accent}}" }
selection = { bg = "{{selection}}", fg = "{{fg_warm}}", modifiers = ["Bold"] }
like = { fg = "{{error}}" }
lyrics_playing = { fg = "{{accent}}", modifiers = ["Bold"] }
