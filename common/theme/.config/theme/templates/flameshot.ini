; Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
; ({{meta.name}}). Edit templates/flameshot.ini, not this file.
;
; Not a stow link: Flameshot saves its settings (pen colour, thickness) by
; replacing the file, which would cut a symlink into the repository. A theme
; switch rewrites it, so changes made in Flameshot's own settings last until
; the next switch; make them here to keep them.
[General]
; Selection border and buttons in the accent, their icons on the panel colour.
uiColor={{accent}}
contrastUiColor={{bg_alt}}
; First pen colour; the in-capture palette still offers the rest.
drawColor={{error}}
; Started on demand by $mod+Shift+s / Print, so no tray icon, no greeting and no
; daemon left behind; the copy is the feedback, a notification would cover it.
disabledTrayIcon=true
showStartupLaunchMessage=false
autoCloseIdleDaemon=true
showDesktopNotification=false
showAbortNotification=false
showHelp=false
showSidePanelButton=true
filenamePattern=%F_%H-%M-%S
