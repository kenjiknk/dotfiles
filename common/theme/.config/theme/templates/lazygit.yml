# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# ({{meta.name}}). Edit templates/lazygit.yml, not this file: the whole
# lazygit config is a template (it has no include). Colours only.
gui:
  theme:
    activeBorderColor: ["{{accent}}", bold]
    inactiveBorderColor: ["{{surface2}}"]
    searchingActiveBorderColor: ["{{yellow2}}", bold]
    optionsTextColor: ["{{blue2}}"]
    selectedLineBgColor: ["{{selection}}"]
    inactiveViewSelectedLineBgColor: ["{{surface}}"]
    cherryPickedCommitFgColor: ["{{accent}}"]
    cherryPickedCommitBgColor: ["{{surface}}"]
    markedBaseCommitFgColor: ["{{blue2}}"]
    markedBaseCommitBgColor: ["{{surface}}"]
    unstagedChangesColor: ["{{error}}"]
    defaultFgColor: ["{{fg}}"]
