# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# ({{meta.name}}). Edit templates/yazi-theme.toml, not this file.
#
# Based on Symphony by vyrx (https://github.com/vyrx-dev), coloured from the
# desktop palette.

# : Manager [[[

[mgr]
cwd = { fg = "{{fg}}" }

# Find
find_keyword = { fg = "{{cyan}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{cyan}}", bold = true, italic = true }

# Marker
marker_copied = { fg = "{{yellow}}", bg = "{{yellow}}" }
marker_cut = { fg = "{{red}}", bg = "{{red}}" }
marker_marked = { fg = "{{cyan}}", bg = "{{cyan}}" }
marker_selected = { fg = "{{accent}}", bg = "{{accent}}" }

# Count
count_copied = { fg = "{{bg_alt}}", bg = "{{yellow}}" }
count_cut = { fg = "{{bg_alt}}", bg = "{{red}}" }
count_selected = { fg = "{{bg_alt}}", bg = "{{accent}}" }

# Border
border_symbol = " "
border_style  = { fg = "{{accent}}" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "{{accent}}" }
perm_read = { fg = "{{yellow}}" }
perm_write = { fg = "{{cyan}}" }
perm_exec = { fg = "{{red}}" }
perm_sep = { fg = "{{fg_dim}}" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "{{accent}}", bg = "{{surface2}}" }
progress_error = { fg = "{{red}}", bg = "{{surface2}}" }

[mode]
# Mode
normal_main = { bg = "{{accent}}", fg = "{{bg_alt}}", bold = true }
normal_alt  = { bg = "{{surface2}}", fg = "{{fg}}" }

# Select mode
select_main = { bg = "{{fg_dim}}", fg = "{{bg_alt}}", bold = true }
select_alt  = { bg = "{{surface2}}", fg = "{{fg}}" }

# Unset mode
unset_main = { bg = "{{yellow}}", fg = "{{bg_alt}}", bold = true }
unset_alt  = { bg = "{{surface2}}", fg = "{{fg}}" }

# : ]]]


# : Select [[[

[select]
border = { fg = "{{accent}}" }
active = { fg = "{{yellow}}", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "{{accent}}" }
value = { fg = "{{fg}}" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "{{accent}}", bold = true, bg = "{{bg_alt}}" }
inactive = { fg = "{{fg_dim}}", bg = "{{bg_alt}}" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "{{accent}}", bg = "{{surface2}}" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "{{accent}}" }
title = {}
hovered = { fg = "{{fg_dim}}", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "{{surface2}}" }
cand = { fg = "{{accent}}" }
rest = { fg = "{{fg_dim}}" }
desc = { fg = "{{fg}}" }
separator = " ▶ "
separator_style = { fg = "{{fg}}" }

# : ]]]


# : Help [[[

[help]
on = { fg = "{{fg}}" }
run = { fg = "{{fg}}" }
footer = { fg = "{{bg_alt}}", bg = "{{fg_dim}}" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "{{accent}}" }
title_warn = { fg = "{{cyan}}" }
title_error = { fg = "{{red}}" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "{{accent}}" },

    # Media
    { mime = "{audio,video}/*", fg = "{{cyan}}" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{fg_dim}}" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "{{blue2}}" },

    # Special files
    { url = "*", is = "orphan", bg = "{{red}}" },
    { url = "*", is = "exec", fg = "{{fg}}" },

    # Fallback
    { url = "*", fg = "{{fg}}" },
    { url = "*/", fg = "{{accent}}" },
]

# : ]]]
