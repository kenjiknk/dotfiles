# Gruvbox Dark, from morhetz/gruvbox (Pavel Pertsev). Windows on bg0, panels on bg0_h; bg_dark is derived. error = bright red: the neutral one is under 3:1.
# Roles as in ../theme.toml. Switch with ~/Scripts/theme-switch ($mod+t).

[meta]
name = "gruvbox-dark"
label = "Gruvbox Dark"
gnome_accent = "yellow"   # nearest of GNOME's named accents, for libadwaita apps
nvim_plugin = "https://github.com/ellisonleao/gruvbox.nvim"
nvim_colorscheme = "gruvbox"
nvim_setup = ''
vscode_extension = "jdinhlife.gruvbox"
vscode_theme = "Gruvbox Dark Medium"
tsuzuri = "gruvbox"

[palette]
bg_dark = "#141617"
bg_alt = "#1d2021"
bg = "#282828"
bg_soft = "#32302f"
surface = "#3c3836"
surface2 = "#504945"
overlay = "#665c54"
fg = "#ebdbb2"
fg_dim = "#a89984"
fg_warm = "#d5c4a1"
muted = "#928374"
accent = "#d79921"
selection = "#504945"
url = "#83a598"
error = "#fb4934"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
red2 = "#fb4934"
green2 = "#b8bb26"
yellow2 = "#fabd2f"
blue2 = "#83a598"
magenta2 = "#d3869b"
cyan2 = "#8ec07c"
orange = "#d65d0e"
orange2 = "#fe8019"
