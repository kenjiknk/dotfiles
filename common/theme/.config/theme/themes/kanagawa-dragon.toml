# Kanagawa Dragon, from kanagawa.nvim (MIT, Tommaso Laurenzi). error = red: the colour states use.
# Roles as in ../theme.toml. Switch with ~/Scripts/theme-switch ($mod+t).

[meta]
name = "kanagawa-dragon"
label = "Kanagawa Dragon"
gnome_accent = "slate"   # nearest of GNOME's named accents, for libadwaita apps
nvim_plugin = "https://github.com/rebelot/kanagawa.nvim"
nvim_colorscheme = "kanagawa-dragon"
nvim_setup = ''
vscode_extension = "metaphore.kanagawa-vscode-color-theme"
vscode_theme = "Kanagawa Dragon"
tsuzuri = "kanagawa-dragon"

[palette]
bg_dark = "#0d0c0c"
bg_alt = "#12120f"
bg = "#181616"
bg_soft = "#1d1c19"
surface = "#282727"
surface2 = "#393836"
overlay = "#625e5a"
fg = "#c5c9c5"
fg_dim = "#a6a69c"
fg_warm = "#c8c093"
muted = "#7a8382"
accent = "#8ba4b0"
selection = "#2d4f67"
url = "#72a7bc"
red = "#c4746e"
error = "#c4746e"
green = "#8a9a7b"
yellow = "#c4b28a"
blue = "#8ba4b0"
magenta = "#a292a3"
cyan = "#8ea4a2"
red2 = "#e46876"
green2 = "#87a987"
yellow2 = "#e6c384"
blue2 = "#7fb4ca"
magenta2 = "#938aa9"
cyan2 = "#7aa89f"
orange = "#b6927b"
orange2 = "#b98d7b"
