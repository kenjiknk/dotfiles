# OLED Minimal: pure black backgrounds (unlit pixels), neutral greys for text and one muted steel-blue accent. Original palette; ANSI colours are desaturated so they stay quiet on black. selection = accent blended into bg at 25%.
# Neovim uses GitHub Dark Default with the backgrounds forced to black (github-nvim-theme specs).
# Roles as in ../theme.toml. Switch with ~/Scripts/theme-switch ($mod+t).

[meta]
name = "oled-minimal"
label = "OLED Minimal"
nvim_plugin = "https://github.com/projekt0n/github-nvim-theme"
nvim_colorscheme = "github_dark_default"
nvim_setup = 'require("github-theme").setup({ palettes = { github_dark_default = { canvas = { default = "#000000", inset = "#000000", overlay = "#0a0a0a", subtle = "#0a0a0a" } } }, specs = { github_dark_default = { bg0 = "#000000", bg1 = "#000000", bg2 = "#0a0a0a", bg3 = "#141414" } } })'
vscode_extension = "GitHub.github-vscode-theme"
vscode_theme = "GitHub Dark Default"
tsuzuri = "monochrome"

[palette]
bg_dark = "#000000"
bg_alt = "#000000"
bg = "#000000"
bg_soft = "#0a0a0a"
surface = "#141414"
surface2 = "#262626"
overlay = "#404040"
fg = "#d4d4d4"
fg_dim = "#8c8c8c"
fg_warm = "#f2f2f2"
muted = "#7a7a7a"
accent = "#8fa8c8"
selection = "#222b36"
url = "#8fa8c8"
error = "#e06c6c"
red = "#d06868"
green = "#7fb88a"
yellow = "#c8b070"
blue = "#7f9fd0"
magenta = "#a98fc8"
cyan = "#72b0b8"
red2 = "#ec8a8a"
green2 = "#9bd2a6"
yellow2 = "#e0c88a"
blue2 = "#9bb8e4"
magenta2 = "#c3a9e0"
cyan2 = "#8fcad2"
orange = "#d09060"
orange2 = "#e6aa7c"

# VS Code: applied by theme-switch as workbench.colorCustomizations over the GitHub
# Dark Default theme. Values are palette roles (or #hex); every other theme clears them.
[vscode_colors]
"editor.background" = "bg"
"editorGutter.background" = "bg"
"editorWidget.background" = "bg_soft"
"editorGroupHeader.tabsBackground" = "bg"
"editor.lineHighlightBackground" = "bg_soft"
"editor.selectionBackground" = "selection"
"sideBar.background" = "bg"
"sideBarSectionHeader.background" = "bg"
"activityBar.background" = "bg"
"activityBar.border" = "surface"
"sideBar.border" = "surface"
"panel.background" = "bg"
"panel.border" = "surface"
"titleBar.activeBackground" = "bg"
"titleBar.inactiveBackground" = "bg"
"titleBar.border" = "surface"
"statusBar.background" = "bg"
"statusBar.border" = "surface"
"tab.activeBackground" = "bg"
"tab.inactiveBackground" = "bg"
"tab.border" = "surface"
"tab.unfocusedActiveBackground" = "bg"
"breadcrumb.background" = "bg"
"terminal.background" = "bg"
"input.background" = "bg_soft"
"dropdown.background" = "bg_soft"
"quickInput.background" = "bg_soft"
"menu.background" = "bg_soft"
"list.hoverBackground" = "bg_soft"
"list.activeSelectionBackground" = "surface"
"list.inactiveSelectionBackground" = "bg_soft"
"minimap.background" = "bg"
"scrollbar.shadow" = "bg"
"notifications.background" = "bg_soft"
