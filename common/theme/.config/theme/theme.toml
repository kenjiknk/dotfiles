# The desktop's colours. Every colour file below is generated from the palette
# of the current theme (themes/*.toml); edit there, never in the outputs.
# Pick a theme with ~/Scripts/theme-switch ($mod+t), or render the current
# one again with:
#
#     ~/Scripts/theme-render ~/.config/theme/theme.toml
#
# Outputs are written through the stow symlinks into this repository and are
# tracked, so a fresh checkout works without running anything; `git diff`
# shows what a theme change did.
#
# Roles every theme defines:
#   bg_dark  ANSI black          bg_alt   panels: bar, rofi, dunst, GTK views
#   bg       windows             bg_soft  raised: GTK cards, i3 inactive titles
#   surface  focused i3 title    surface2 subtle borders
#   overlay  decoration only, below 3:1, never text
#   fg / fg_dim / fg_warm / muted   text: main, secondary, cursor, quiet
#   accent   focus, current workspace, GTK accent
#   selection, url, error (states: urgent, critical, failed)
#   red green yellow blue magenta cyan (+ ...2 bright), orange, orange2: ANSI

[meta]
templates_dir = "templates"
palette = "themes/solarized-osaka.toml"   # rewritten by theme-switch

# Outputs: paths through the deployed symlinks, so they land in the repo.

[[target]]
template = "i3-colors"
output   = "~/.config/i3/colors"
hook     = "i3-msg -q reload"

[[target]]
template = "rofi-colors.rasi"
output   = "~/.config/rofi/colors.rasi"

[[target]]
template = "dunstrc"
output   = "~/.config/dunst/dunstrc"
hook     = "dunstctl reload"

[[target]]
template = "kitty-colors.conf"
output   = "~/.config/kitty/colors.conf"
hook     = "pkill -USR1 -x kitty"

[[target]]
template = "gtk3.css"
output   = "~/.config/gtk-3.0/gtk.css"

[[target]]
template = "gtk4.css"
output   = "~/.config/gtk-4.0/gtk.css"

[[target]]
template = "zathura-colors"
output   = "~/.config/zathura/colors"

[[target]]
template = "yazi-theme.toml"
output   = "~/.config/yazi/theme.toml"

[[target]]
template = "nvim-theme.lua"
output   = "~/.config/nvim/lua/theme.lua"

[[target]]
template = "tsuzuri-theme"
output   = "~/.config/theme/tsuzuri"   # read by the $mod+Shift+n binding

[[target]]
template = "zen-userChrome.css"
output   = "~/.config/theme/zen/userChrome.css"

[[target]]
template = "colors.sh"
output   = "~/.config/theme/colors.sh"
