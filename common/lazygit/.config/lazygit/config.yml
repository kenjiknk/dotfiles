# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (github-dark). Edit templates/lazygit.yml, not this file: the whole
# lazygit config is a template (it has no include). Colours only.
gui:
  theme:
    activeBorderColor: ["#2f81f7", bold]
    inactiveBorderColor: ["#30363d"]
    searchingActiveBorderColor: ["#e3b341", bold]
    optionsTextColor: ["#79c0ff"]
    selectedLineBgColor: ["#1a365c"]
    inactiveViewSelectedLineBgColor: ["#21262d"]
    cherryPickedCommitFgColor: ["#2f81f7"]
    cherryPickedCommitBgColor: ["#21262d"]
    markedBaseCommitFgColor: ["#79c0ff"]
    markedBaseCommitBgColor: ["#21262d"]
    unstagedChangesColor: ["#f85149"]
    defaultFgColor: ["#e6edf3"]
