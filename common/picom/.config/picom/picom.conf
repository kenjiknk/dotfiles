# Optional compositor: dimmed unfocused windows, rounded corners, short
# animations. No blur.
#
# Old-style options (no `rules`) so picom 9 on older distros reads it too.

backend = "glx";
vsync = true;

inactive-dim = 0.15;
# Never dimmed.
focus-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'i3lock'"
];

shadow = false;
fading = false;

# 4 px, the same radius rofi and dunst draw. Not the bar, the desktop, the lock
# screen or fullscreen windows (games, video), which meet the screen edge.
corner-radius = 4;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3lock'",
    # picom 9 needs the `:32a`; picom 12+ logs a deprecation warning for it
    # and otherwise reads the rule the same.
    "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# picom 12+; older versions ignore it. Workspace switches use open/close too,
# since i3 unmaps the windows of the workspace it leaves.
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.98;
        duration = 0.10;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.98;
        duration = 0.07;
    },
    {
        # Neighbours glide to their new size. Experimental in picom; drop this
        # block if it misbehaves.
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.10;
    }
);

unredir-if-possible = true;
