# Compositor: what swayfx used to do — blur behind translucent windows (kitty's
# background_opacity) and a darker tint on unfocused ones. Entirely optional:
# without picom running, the session works the same and kitty is just opaque.
#
# Old-style options on purpose. picom 12 introduced `rules`, but these still
# work there and are what the picom 9 of older LTS distros understands.

backend = "glx";
vsync = true;

# Blur, roughly swayfx's `blur_passes 2` / `blur_radius 5`.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'maim'",
    "class_g = 'slop'"
];

# Dim unfocused windows, like `default_dim_inactive 0.15`.
inactive-dim = 0.15;
# The bar, the launcher and notifications count as focused, so they never dim.
focus-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'i3lock'"
];

shadow = false;
fading = false;

# Fullscreen games and video skip the compositor.
unredir-if-possible = true;
