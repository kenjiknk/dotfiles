# Optional compositor: blur behind translucent windows, dimmed unfocused ones,
# short animations. Without it kitty is simply opaque.
#
# Old-style options (no `rules`) so picom 9 on older distros reads it too.

backend = "glx";
vsync = true;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'"
];

inactive-dim = 0.15;
# Never dimmed.
focus-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'Rofi'",
    "class_g = 'Dunst'",
    "class_g = 'i3lock'"
];

shadow = false;
fading = false;

# picom 12+; older versions ignore it. Workspace switches use open/close too,
# since i3 unmaps the windows of the workspace it leaves.
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.98;
        duration = 0.10;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.98;
        duration = 0.07;
    },
    {
        # Neighbours glide to their new size. Experimental in picom; drop this
        # block if it misbehaves.
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.10;
    }
);

unredir-if-possible = true;
