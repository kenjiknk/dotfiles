# Under X (no XSETTINGS daemon) GTK reads its theme, font and cursor from here.
# adw-gtk3 (libadwaita look for GTK 3; plain Adwaita without it) recoloured by
# gtk.css next to this file, Papirus icons, Inter. ~/Scripts/gsettings-sync
# copies these to gsettings for libadwaita and Flatpak apps.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Inter 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
