# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (kanagawa-dragon). Edit templates/yazi-theme.toml, not this file.
#
# Based on Symphony by vyrx (https://github.com/vyrx-dev), coloured from the
# desktop palette.

# : Manager [[[

[mgr]
cwd = { fg = "#c5c9c5" }

# Find
find_keyword = { fg = "#8ea4a2", bold = true, italic = true, underline = true }
find_position = { fg = "#8ea4a2", bold = true, italic = true }

# Marker
marker_copied = { fg = "#c4b28a", bg = "#c4b28a" }
marker_cut = { fg = "#c4746e", bg = "#c4746e" }
marker_marked = { fg = "#8ea4a2", bg = "#8ea4a2" }
marker_selected = { fg = "#8ba4b0", bg = "#8ba4b0" }

# Count
count_copied = { fg = "#12120f", bg = "#c4b28a" }
count_cut = { fg = "#12120f", bg = "#c4746e" }
count_selected = { fg = "#12120f", bg = "#8ba4b0" }

# Border
border_symbol = " "
border_style  = { fg = "#8ba4b0" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#8ba4b0" }
perm_read = { fg = "#c4b28a" }
perm_write = { fg = "#8ea4a2" }
perm_exec = { fg = "#c4746e" }
perm_sep = { fg = "#a6a69c" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#8ba4b0", bg = "#393836" }
progress_error = { fg = "#c4746e", bg = "#393836" }

[mode]
# Mode
normal_main = { bg = "#8ba4b0", fg = "#12120f", bold = true }
normal_alt  = { bg = "#393836", fg = "#c5c9c5" }

# Select mode
select_main = { bg = "#a6a69c", fg = "#12120f", bold = true }
select_alt  = { bg = "#393836", fg = "#c5c9c5" }

# Unset mode
unset_main = { bg = "#c4b28a", fg = "#12120f", bold = true }
unset_alt  = { bg = "#393836", fg = "#c5c9c5" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#8ba4b0" }
active = { fg = "#c4b28a", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#8ba4b0" }
value = { fg = "#c5c9c5" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#8ba4b0", bold = true, bg = "#12120f" }
inactive = { fg = "#a6a69c", bg = "#12120f" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#8ba4b0", bg = "#393836" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#8ba4b0" }
title = {}
hovered = { fg = "#a6a69c", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#393836" }
cand = { fg = "#8ba4b0" }
rest = { fg = "#a6a69c" }
desc = { fg = "#c5c9c5" }
separator = " ▶ "
separator_style = { fg = "#c5c9c5" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#c5c9c5" }
run = { fg = "#c5c9c5" }
footer = { fg = "#12120f", bg = "#a6a69c" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#8ba4b0" }
title_warn = { fg = "#8ea4a2" }
title_error = { fg = "#c4746e" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#8ba4b0" },

    # Media
    { mime = "{audio,video}/*", fg = "#8ea4a2" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a6a69c" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#7fb4ca" },

    # Special files
    { url = "*", is = "orphan", bg = "#c4746e" },
    { url = "*", is = "exec", fg = "#c5c9c5" },

    # Fallback
    { url = "*", fg = "#c5c9c5" },
    { url = "*/", fg = "#8ba4b0" },
]

# : ]]]
