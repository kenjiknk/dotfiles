# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (solarized-osaka). Edit templates/yazi-theme.toml, not this file.
#
# Based on Symphony by vyrx (https://github.com/vyrx-dev), coloured from the
# desktop palette.

# : Manager [[[

[mgr]
cwd = { fg = "#9fabad" }

# Find
find_keyword = { fg = "#29a298", bold = true, italic = true, underline = true }
find_position = { fg = "#29a298", bold = true, italic = true }

# Marker
marker_copied = { fg = "#b28500", bg = "#b28500" }
marker_cut = { fg = "#f65351", bg = "#f65351" }
marker_marked = { fg = "#29a298", bg = "#29a298" }
marker_selected = { fg = "#268bd3", bg = "#268bd3" }

# Count
count_copied = { fg = "#000f13", bg = "#b28500" }
count_cut = { fg = "#000f13", bg = "#f65351" }
count_selected = { fg = "#000f13", bg = "#268bd3" }

# Border
border_symbol = " "
border_style  = { fg = "#268bd3" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#268bd3" }
perm_read = { fg = "#b28500" }
perm_write = { fg = "#29a298" }
perm_exec = { fg = "#f65351" }
perm_sep = { fg = "#839395" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#268bd3", bg = "#0b4250" }
progress_error = { fg = "#f65351", bg = "#0b4250" }

[mode]
# Mode
normal_main = { bg = "#268bd3", fg = "#000f13", bold = true }
normal_alt  = { bg = "#0b4250", fg = "#9fabad" }

# Select mode
select_main = { bg = "#839395", fg = "#000f13", bold = true }
select_alt  = { bg = "#0b4250", fg = "#9fabad" }

# Unset mode
unset_main = { bg = "#b28500", fg = "#000f13", bold = true }
unset_alt  = { bg = "#0b4250", fg = "#9fabad" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#268bd3" }
active = { fg = "#b28500", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#268bd3" }
value = { fg = "#9fabad" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#268bd3", bold = true, bg = "#000f13" }
inactive = { fg = "#839395", bg = "#000f13" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#268bd3", bg = "#0b4250" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#268bd3" }
title = {}
hovered = { fg = "#839395", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#0b4250" }
cand = { fg = "#268bd3" }
rest = { fg = "#839395" }
desc = { fg = "#9fabad" }
separator = " ▶ "
separator_style = { fg = "#9fabad" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#9fabad" }
run = { fg = "#9fabad" }
footer = { fg = "#000f13", bg = "#839395" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#268bd3" }
title_warn = { fg = "#29a298" }
title_error = { fg = "#f65351" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#268bd3" },

    # Media
    { mime = "{audio,video}/*", fg = "#29a298" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#839395" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#47adf5" },

    # Special files
    { url = "*", is = "orphan", bg = "#f65351" },
    { url = "*", is = "exec", fg = "#9fabad" },

    # Fallback
    { url = "*", fg = "#9fabad" },
    { url = "*/", fg = "#268bd3" },
]

# : ]]]
