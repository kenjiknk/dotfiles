# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (gruvbox-dark). Edit templates/yazi-theme.toml, not this file.
#
# Based on Symphony by vyrx (https://github.com/vyrx-dev), coloured from the
# desktop palette.

# : Manager [[[

[mgr]
cwd = { fg = "#ebdbb2" }

# Find
find_keyword = { fg = "#689d6a", bold = true, italic = true, underline = true }
find_position = { fg = "#689d6a", bold = true, italic = true }

# Marker
marker_copied = { fg = "#d79921", bg = "#d79921" }
marker_cut = { fg = "#fb4934", bg = "#fb4934" }
marker_marked = { fg = "#689d6a", bg = "#689d6a" }
marker_selected = { fg = "#d79921", bg = "#d79921" }

# Count
count_copied = { fg = "#1d2021", bg = "#d79921" }
count_cut = { fg = "#1d2021", bg = "#fb4934" }
count_selected = { fg = "#1d2021", bg = "#d79921" }

# Border
border_symbol = " "
border_style  = { fg = "#d79921" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#d79921" }
perm_read = { fg = "#d79921" }
perm_write = { fg = "#689d6a" }
perm_exec = { fg = "#fb4934" }
perm_sep = { fg = "#a89984" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#d79921", bg = "#504945" }
progress_error = { fg = "#fb4934", bg = "#504945" }

[mode]
# Mode
normal_main = { bg = "#d79921", fg = "#1d2021", bold = true }
normal_alt  = { bg = "#504945", fg = "#ebdbb2" }

# Select mode
select_main = { bg = "#a89984", fg = "#1d2021", bold = true }
select_alt  = { bg = "#504945", fg = "#ebdbb2" }

# Unset mode
unset_main = { bg = "#d79921", fg = "#1d2021", bold = true }
unset_alt  = { bg = "#504945", fg = "#ebdbb2" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#d79921" }
active = { fg = "#d79921", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#d79921" }
value = { fg = "#ebdbb2" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#d79921", bold = true, bg = "#1d2021" }
inactive = { fg = "#a89984", bg = "#1d2021" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#d79921", bg = "#504945" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#d79921" }
title = {}
hovered = { fg = "#a89984", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#504945" }
cand = { fg = "#d79921" }
rest = { fg = "#a89984" }
desc = { fg = "#ebdbb2" }
separator = " ▶ "
separator_style = { fg = "#ebdbb2" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#ebdbb2" }
run = { fg = "#ebdbb2" }
footer = { fg = "#1d2021", bg = "#a89984" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#d79921" }
title_warn = { fg = "#689d6a" }
title_error = { fg = "#fb4934" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#d79921" },

    # Media
    { mime = "{audio,video}/*", fg = "#689d6a" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a89984" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#83a598" },

    # Special files
    { url = "*", is = "orphan", bg = "#fb4934" },
    { url = "*", is = "exec", fg = "#ebdbb2" },

    # Fallback
    { url = "*", fg = "#ebdbb2" },
    { url = "*/", fg = "#d79921" },
]

# : ]]]
