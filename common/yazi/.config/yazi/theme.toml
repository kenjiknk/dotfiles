# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (github-dark). Edit templates/yazi-theme.toml, not this file.
#
# Based on Symphony by vyrx (https://github.com/vyrx-dev), coloured from the
# desktop palette.

# : Manager [[[

[mgr]
cwd = { fg = "#e6edf3" }

# Find
find_keyword = { fg = "#39c5cf", bold = true, italic = true, underline = true }
find_position = { fg = "#39c5cf", bold = true, italic = true }

# Marker
marker_copied = { fg = "#d29922", bg = "#d29922" }
marker_cut = { fg = "#f85149", bg = "#f85149" }
marker_marked = { fg = "#39c5cf", bg = "#39c5cf" }
marker_selected = { fg = "#2f81f7", bg = "#2f81f7" }

# Count
count_copied = { fg = "#010409", bg = "#d29922" }
count_cut = { fg = "#010409", bg = "#f85149" }
count_selected = { fg = "#010409", bg = "#2f81f7" }

# Border
border_symbol = " "
border_style  = { fg = "#2f81f7" }

# : ]]]


# : Status [[[

[status]
sep_left = { open = "", close = "🭠" }
sep_right = { open = "🭁", close = "" }

# Permissions
perm_type = { fg = "#2f81f7" }
perm_read = { fg = "#d29922" }
perm_write = { fg = "#39c5cf" }
perm_exec = { fg = "#f85149" }
perm_sep = { fg = "#8b949e" }

# Progress
progress_label = { bold = true }
progress_normal = { fg = "#2f81f7", bg = "#30363d" }
progress_error = { fg = "#f85149", bg = "#30363d" }

[mode]
# Mode
normal_main = { bg = "#2f81f7", fg = "#010409", bold = true }
normal_alt  = { bg = "#30363d", fg = "#e6edf3" }

# Select mode
select_main = { bg = "#8b949e", fg = "#010409", bold = true }
select_alt  = { bg = "#30363d", fg = "#e6edf3" }

# Unset mode
unset_main = { bg = "#d29922", fg = "#010409", bold = true }
unset_alt  = { bg = "#30363d", fg = "#e6edf3" }

# : ]]]


# : Select [[[

[select]
border = { fg = "#2f81f7" }
active = { fg = "#d29922", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "#2f81f7" }
value = { fg = "#e6edf3" }

# : ]]]

# : Tabs [[[

[tabs]
active = { fg = "#2f81f7", bold = true, bg = "#010409" }
inactive = { fg = "#8b949e", bg = "#010409" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#2f81f7", bg = "#30363d" }

# : ]]]


# : Tasks [[[

[tasks]
border = { fg = "#2f81f7" }
title = {}
hovered = { fg = "#8b949e", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#30363d" }
cand = { fg = "#2f81f7" }
rest = { fg = "#8b949e" }
desc = { fg = "#e6edf3" }
separator = " ▶ "
separator_style = { fg = "#e6edf3" }

# : ]]]


# : Help [[[

[help]
on = { fg = "#e6edf3" }
run = { fg = "#e6edf3" }
footer = { fg = "#010409", bg = "#8b949e" }

# : ]]]


# : Notify [[[

[notify]
title_info = { fg = "#2f81f7" }
title_warn = { fg = "#39c5cf" }
title_error = { fg = "#f85149" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#2f81f7" },

    # Media
    { mime = "{audio,video}/*", fg = "#39c5cf" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#8b949e" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#79c0ff" },

    # Special files
    { url = "*", is = "orphan", bg = "#f85149" },
    { url = "*", is = "exec", fg = "#e6edf3" },

    # Fallback
    { url = "*", fg = "#e6edf3" },
    { url = "*/", fg = "#2f81f7" },
]

# : ]]]
