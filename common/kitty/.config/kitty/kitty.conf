# Fonts
font_family JetBrainsMono Nerd Font
# font_family Iosevka Nerd Font Mono
bold_italic_font auto
font_size 11

# Window
window_padding_width 0
background_blur 1
background_opacity 0.9
hide_window_decorations yes
scrollback_indicator_opacity 0.0

# Cursor
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.15
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor

# Behavior
enable_audio_bell no
confirm_os_window_close 0
# `no` is kitty's default. `yes` lets any program running in the terminal drive
# kitty — send text, open and close windows, read window contents — and it works
# over SSH too. Nothing here uses `kitty @`, so there is nothing to trade for it.
allow_remote_control no

# Colors: Kanagawa Dragon, from kanagawa.nvim (MIT).
include kanagawa-dragon.conf
