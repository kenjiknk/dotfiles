<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The desktop's two families, as the generic names every program falls back
  to: Inter for interface text, JetBrains Mono for monospace. Without this,
  `monospace` resolves to Noto Sans Mono, so zathura (and anything else that
  just asks for "monospace") drifts from kitty and rofi.

  Noto comes after, for scripts and symbols the first choice lacks; emoji last.
  A family that is not installed is skipped, so this is safe on any machine.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
