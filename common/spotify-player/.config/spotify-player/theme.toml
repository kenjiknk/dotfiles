# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (solarized-osaka). Edit templates/spotify-player-theme.toml, not this file.
# Selected in ~/.config/spotify-player/app.toml as theme = "desktop".

[[themes]]
name = "desktop"

[themes.palette]
background = "#001419"
foreground = "#9fabad"
black = "#000b0e"
red = "#db302d"
green = "#849900"
yellow = "#b28500"
blue = "#268bd3"
magenta = "#d23681"
cyan = "#29a298"
white = "#adb8b8"
bright_black = "#839395"
bright_red = "#f65351"
bright_green = "#b7d300"
bright_yellow = "#e6ac00"
bright_blue = "#47adf5"
bright_magenta = "#f254a1"
bright_cyan = "#2bd1c3"
bright_white = "#9fabad"

# The accent marks what is playing and what is selected, as everywhere else.
[themes.component_style]
block_title = { fg = "#268bd3", modifiers = ["Bold"] }
border = { fg = "#0b4250" }
playback_track = { fg = "#9fabad", modifiers = ["Bold"] }
playback_artists = { fg = "#268bd3" }
playback_album = { fg = "#839395" }
playback_metadata = { fg = "#738a90" }
playback_progress_bar = { bg = "#073541", fg = "#268bd3" }
current_playing = { fg = "#268bd3", modifiers = ["Bold"] }
page_desc = { fg = "#268bd3", modifiers = ["Bold"] }
table_header = { fg = "#268bd3" }
selection = { bg = "#073541", fg = "#adb8b8", modifiers = ["Bold"] }
like = { fg = "#f65351" }
lyrics_playing = { fg = "#268bd3", modifiers = ["Bold"] }
