# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (gruvbox-dark). Edit templates/spotify-player-theme.toml, not this file.
# Selected in ~/.config/spotify-player/app.toml as theme = "desktop".

[[themes]]
name = "desktop"

[themes.palette]
background = "#282828"
foreground = "#ebdbb2"
black = "#141617"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#d5c4a1"
bright_black = "#a89984"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"

# The accent marks what is playing and what is selected, as everywhere else.
[themes.component_style]
block_title = { fg = "#d79921", modifiers = ["Bold"] }
border = { fg = "#504945" }
playback_track = { fg = "#ebdbb2", modifiers = ["Bold"] }
playback_artists = { fg = "#d79921" }
playback_album = { fg = "#a89984" }
playback_metadata = { fg = "#928374" }
playback_progress_bar = { bg = "#3c3836", fg = "#d79921" }
current_playing = { fg = "#d79921", modifiers = ["Bold"] }
page_desc = { fg = "#d79921", modifiers = ["Bold"] }
table_header = { fg = "#d79921" }
selection = { bg = "#504945", fg = "#d5c4a1", modifiers = ["Bold"] }
like = { fg = "#fb4934" }
lyrics_playing = { fg = "#d79921", modifiers = ["Bold"] }
