# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (github-dark). Edit templates/spotify-player-theme.toml, not this file.
# Selected in ~/.config/spotify-player/app.toml as theme = "desktop".

[[themes]]
name = "desktop"

[themes.palette]
background = "#0d1117"
foreground = "#e6edf3"
black = "#010409"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
magenta = "#bc8cff"
cyan = "#39c5cf"
white = "#f0f6fc"
bright_black = "#8b949e"
bright_red = "#ffa198"
bright_green = "#56d364"
bright_yellow = "#e3b341"
bright_blue = "#79c0ff"
bright_magenta = "#d2a8ff"
bright_cyan = "#56d4dd"
bright_white = "#e6edf3"

# The accent marks what is playing and what is selected, as everywhere else.
[themes.component_style]
block_title = { fg = "#2f81f7", modifiers = ["Bold"] }
border = { fg = "#30363d" }
playback_track = { fg = "#e6edf3", modifiers = ["Bold"] }
playback_artists = { fg = "#2f81f7" }
playback_album = { fg = "#8b949e" }
playback_metadata = { fg = "#7d8590" }
playback_progress_bar = { bg = "#21262d", fg = "#2f81f7" }
current_playing = { fg = "#2f81f7", modifiers = ["Bold"] }
page_desc = { fg = "#2f81f7", modifiers = ["Bold"] }
table_header = { fg = "#2f81f7" }
selection = { bg = "#1a365c", fg = "#f0f6fc", modifiers = ["Bold"] }
like = { fg = "#f85149" }
lyrics_playing = { fg = "#2f81f7", modifiers = ["Bold"] }
