# Generated by ~/Scripts/theme-render from ~/.config/theme/theme.toml
# (kanagawa-dragon). Edit templates/spotify-player-theme.toml, not this file.
# Selected in ~/.config/spotify-player/app.toml as theme = "desktop".

[[themes]]
name = "desktop"

[themes.palette]
background = "#181616"
foreground = "#c5c9c5"
black = "#0d0c0c"
red = "#c4746e"
green = "#8a9a7b"
yellow = "#c4b28a"
blue = "#8ba4b0"
magenta = "#a292a3"
cyan = "#8ea4a2"
white = "#c8c093"
bright_black = "#a6a69c"
bright_red = "#e46876"
bright_green = "#87a987"
bright_yellow = "#e6c384"
bright_blue = "#7fb4ca"
bright_magenta = "#938aa9"
bright_cyan = "#7aa89f"
bright_white = "#c5c9c5"

# The accent marks what is playing and what is selected, as everywhere else.
[themes.component_style]
block_title = { fg = "#8ba4b0", modifiers = ["Bold"] }
border = { fg = "#393836" }
playback_track = { fg = "#c5c9c5", modifiers = ["Bold"] }
playback_artists = { fg = "#8ba4b0" }
playback_album = { fg = "#a6a69c" }
playback_metadata = { fg = "#7a8382" }
playback_progress_bar = { bg = "#282727", fg = "#8ba4b0" }
current_playing = { fg = "#8ba4b0", modifiers = ["Bold"] }
page_desc = { fg = "#8ba4b0", modifiers = ["Bold"] }
table_header = { fg = "#8ba4b0" }
selection = { bg = "#2d4f67", fg = "#c8c093", modifiers = ["Bold"] }
like = { fg = "#c4746e" }
lyrics_playing = { fg = "#8ba4b0", modifiers = ["Bold"] }
