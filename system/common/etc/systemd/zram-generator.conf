# Compressed swap in RAM (zram-generator). With no swap at all, running out of
# memory in a large build goes straight to the kernel OOM killer, which may take
# the session down instead of the build. zram costs nothing until it is used.
# Half the RAM, at most 8 GiB; zstd packs typical pages about 3:1.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
