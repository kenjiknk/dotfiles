# Workaround for the Xorg crash seen on 2026-11-06 when docking: modesetting
# segfaulted in msEnableSharedPixmapFlipping (via RRCrtcSet) because it does
# not detect that evdi (DisplayLink) cannot page flip. Disabling PageFlip
# avoids that path. See
# https://support.displaylink.com/knowledgebase/articles/1181623
# The amdgpu side is configured in 10-amdgpu.conf (TearFree, amdgpu driver).
Section "OutputClass"
    Identifier "evdi-no-pageflip"
    MatchDriver "evdi"
    Driver "modesetting"
    Option "PageFlip" "false"
EndSection
